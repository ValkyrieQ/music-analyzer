server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads go through this proxy, so the body limit has to clear the backend's own cap.
    client_max_body_size 120M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames make these safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analysis jobs are long-running and a first-time transposed render can take a
        # while; the defaults (60s) would cut those off mid-flight.
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Stream audio straight through instead of buffering whole files to disk.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # SPA fallback: any unknown path is a client-side route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
